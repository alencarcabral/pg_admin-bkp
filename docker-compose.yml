services:
  pgadmin:
    container_name: pg_admin
    build: .
    image: dpage/pgadmin4:latest
    hostname: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./data:/var/lib/pgadmin
      - ./backups:/bancos/backups
      - ./app:/app


